<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이터 가져오기 — My Favorite Watch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="connect-page">
  <div class="connect-container">
    <div class="connect-header">
      <a href="{{ url_for('settings.settings') }}" class="back-btn">← 설정</a>
      <h1 class="connect-title" style="margin-top:12px;">다른 시트에서 가져오기</h1>
      <p class="connect-desc">다른 Google Sheet의 데이터를 현재 시트로 가져옵니다.</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-success">{{ success }} <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-sm" style="margin-left:8px;">목록 보기</a></div>
    {% endif %}

    <!-- 1단계: URL 입력 -->
    <form method="post" action="{{ url_for('sheet.import_sheet') }}" class="connect-form">
      <input type="hidden" name="action" value="preview">
      <div class="form-group">
        <label class="form-label">소스 Google Sheet URL</label>
        <input type="url" name="src_url" class="form-input"
          placeholder="https://docs.google.com/spreadsheets/d/..." required
          value="">
      </div>
      <button type="submit" class="btn btn-secondary btn-full">워크시트 목록 불러오기</button>
    </form>

    <!-- 2단계: 워크시트 선택 -->
    {% if worksheets %}
    <div class="settings-section" style="margin-top:16px;">
      <h2 class="section-title">워크시트 선택</h2>
      <form method="post" action="{{ url_for('sheet.import_sheet') }}">
        <input type="hidden" name="action" value="import">
        <input type="hidden" name="src_sheet_id" value="{{ src_sheet_id }}">
        <div class="form-group">
          <label class="form-label">가져올 워크시트</label>
          <select name="src_worksheet" class="form-input" required>
            {% for ws in worksheets %}
            <option value="{{ ws }}">{{ ws }}</option>
            {% endfor %}
          </select>
        </div>
        <p class="form-hint">선택한 워크시트의 데이터가 현재 시트에 추가됩니다. 중복 항목은 그대로 추가됩니다.</p>
        <button type="submit" class="btn btn-primary btn-full"
          onclick="return confirm('데이터를 가져오시겠습니까? 기존 데이터는 유지됩니다.')">
          가져오기
        </button>
      </form>
    </div>
    {% endif %}
  </div>
</body>
</html>
