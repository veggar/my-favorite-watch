{#
  모든 화면이 공유하는 <head> 메타 정보.

  - PWA(P2-1): manifest / 아이콘 / 홈 화면 추가 관련 메타
  - 초기 로딩 표시(P2-2): 외부 CSS 가 도착하기 전에도 "Now Loading" 이 보여야
    하므로 스타일을 인라인으로 둔다. 실제 요소는 partials/boot_loading.html 에 있다.
#}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="나의 영상 작품 기록 관리 — 본인 Google Sheet에 저장하는 감상 기록 서비스">
<meta name="theme-color" content="#4f46e5">

<link rel="manifest" href="{{ url_for('site.manifest') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon-16.png') }}" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon-180.png') }}">

<meta name="application-name" content="My Favorite Watch">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Favorite Watch">

<style>
  /* 초기 로딩 표시 (ui-ux-standards §1) */
  #boot-loading {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: #f9fafb;
    opacity: 1;
    transition: opacity .18s ease-out;
  }
  #boot-loading .boot-text {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: baseline;
    gap: 2px;
    font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #6b7280;
  }
  #boot-loading .boot-dots { display: inline-flex; gap: 2px; margin-left: 2px; }
  #boot-loading .boot-dots i {
    width: 3px; height: 3px; border-radius: 50%;
    background: #6b7280;
    animation: boot-dot 1.2s ease-in-out infinite;
  }
  #boot-loading .boot-dots i:nth-child(2) { animation-delay: .2s; }
  #boot-loading .boot-dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes boot-dot {
    0%, 60%, 100% { opacity: .2; }
    30%           { opacity: 1; }
  }
  body.app-ready #boot-loading { opacity: 0; pointer-events: none; visibility: hidden; }
  @media (prefers-reduced-motion: reduce) {
    #boot-loading { transition: none; }
    #boot-loading .boot-dots i { animation: none; opacity: .6; }
  }
</style>
