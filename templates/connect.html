<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시트 연결 — My Favorite Watch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="connect-page">
  <div class="connect-container">
    <div class="connect-header">
      <span class="logo-icon">🎬</span>
      <h1 class="connect-title">Google Sheet 연결</h1>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <!-- 탭 -->
    <div class="tab-bar" id="tab-bar">
      <button class="tab-btn active" onclick="switchTab('connect')">기존 시트 연결</button>
      <button class="tab-btn" onclick="switchTab('create')">새 시트 만들기</button>
    </div>

    <!-- 기존 시트 연결 -->
    <div id="tab-connect" class="tab-content">
      <p class="connect-desc">연결할 Google Sheet URL을 입력하세요.<br>
        지정한 워크시트가 없으면 자동으로 생성됩니다.</p>
      <form method="post" action="{{ url_for('sheet.connect') }}" class="connect-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="connect">
        <div class="form-group">
          <label class="form-label">Google Sheet URL</label>
          <input type="url" name="sheet_url" class="form-input"
            placeholder="https://docs.google.com/spreadsheets/d/..." required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">워크시트 이름</label>
          <input type="text" name="worksheet_name" class="form-input"
            value="{{ default_worksheet }}" placeholder="{{ default_worksheet }}">
          <p class="form-hint">데이터를 저장할 워크시트(탭) 이름입니다.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-full">연결하기</button>
      </form>
    </div>

    <!-- 새 시트 만들기 -->
    <div id="tab-create" class="tab-content" style="display:none;">
      <p class="connect-desc">새 Google Sheet 문서를 만들고 바로 시작하세요.</p>
      <form method="post" action="{{ url_for('sheet.connect') }}" class="connect-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="create">
        <div class="form-group">
          <label class="form-label">문서 이름</label>
          <input type="text" name="doc_title" class="form-input"
            value="My Favorite Watch" placeholder="My Favorite Watch">
        </div>
        <div class="form-group">
          <label class="form-label">워크시트 이름</label>
          <input type="text" name="worksheet_name" class="form-input"
            value="{{ default_worksheet }}" placeholder="{{ default_worksheet }}">
        </div>
        <button type="submit" class="btn btn-primary btn-full">새 시트 만들기</button>
      </form>
    </div>

    <div class="connect-footer">
      <form method="post" action="{{ url_for('auth.logout') }}" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="link-muted" style="background:none;border:none;cursor:pointer;padding:0;">로그아웃</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).style.display = 'block';
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
